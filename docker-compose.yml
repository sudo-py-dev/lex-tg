services:
  bot:
    # build: .
    image: ghcr.io/sudo-py-dev/lex-tg:latest
    container_name: lex-tg
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./sessions:/app/sessions
      - ./logs:/app/logs
      - ./data:/app/data
    environment:
      DATABASE_URL: "${DATABASE_URL:?Set DATABASE_URL for the bot database role}"
      POSTGRES_PASSWORD: ""
      BOT_DB_PASSWORD: ""
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "test -f /app/data/heartbeat && test $$(($$(date +%s) - $$(cat /app/data/heartbeat))) -lt 120"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  db:
    image: postgres:16-alpine
    container_name: lex-tg-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a unique PostgreSQL bootstrap password}"
      POSTGRES_DB: ${POSTGRES_DB:-botdb}
      BOT_DB_PASSWORD: "${BOT_DB_PASSWORD:?Set a separate password for lex_bot}"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/init_postgres.sh:/docker-entrypoint-initdb.d/10-lex-bot.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5
